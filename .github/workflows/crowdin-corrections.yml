name: Apply reviewed Crowdin corrections

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin-translations
  cancel-in-progress: false

jobs:
  corrections:
    if: github.repository == 'AlanHuang99/Voyager' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Test correction safeguards
        run: uv run --no-project python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Apply fixed reviewed correction mapping
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: uv run --no-project python -B scripts/crowdin_corrections.py --apply
      - name: Export and verify approved corrections
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          uv run --no-project python -B scripts/export_translation_drafts.py --output "$RUNNER_TEMP/crowdin-corrections"
          uv run --no-project python -B scripts/crowdin_corrections.py --verify-export "$RUNNER_TEMP/crowdin-corrections/approved"
      - uses: actions/upload-artifact@v7
        with:
          name: crowdin-corrected-resources
          path: ${{ runner.temp }}/crowdin-corrections
          retention-days: 7
