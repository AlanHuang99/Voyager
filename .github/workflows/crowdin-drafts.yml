name: Crowdin rollout drafts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect engines, create unapproved drafts, or export rollout resources
        type: choice
        options: [inspect, pretranslate, export]
        default: inspect
      engine_id:
        description: Machine translation engine ID (required for pretranslate)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: crowdin-translations
  cancel-in-progress: false

jobs:
  drafts:
    if: github.repository == 'AlanHuang99/Voyager' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - name: Test draft safeguards
        run: uv run --no-project python -B -m unittest discover -s scripts -p 'test_*.py'
      - name: Inspect or pretranslate
        if: inputs.mode != 'export'
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_DRAFT_MODE: ${{ inputs.mode }}
          CROWDIN_MT_ENGINE_ID: ${{ inputs.engine_id }}
        run: uv run --no-project python -B scripts/crowdin_drafts.py
      - name: Export rollout resources
        if: inputs.mode == 'export'
        env:
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: uv run --no-project python -B scripts/export_translation_drafts.py --output "$RUNNER_TEMP/crowdin-rollout"
      - name: Upload translation exports
        if: inputs.mode == 'export'
        uses: actions/upload-artifact@v7
        with:
          name: crowdin-rollout
          path: ${{ runner.temp }}/crowdin-rollout
          retention-days: 7
